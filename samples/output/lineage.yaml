tasks:
- id: '{AD1BE492-BB24-47DF-B4CB-40527E800BC5}'
  name: Create Sales Forecast Input Spreadsheet
  type: DTS.Pipeline.1
  packageId: CreateSalesForecastInput
  packageName: CreateSalesForecastInput
  description: ''
  businessNarrative: >-
    Aliran Data (Data Flow): Mengambil data dari `Kota` (`select
      g.GeographyKey
    , g.SalesTerritoryKey  

    , g.City

    , g.StateProvinceName [State]

    , g.PostalCode

    from dbo.DimGeography g

    join dbo.DimSalesTerritory t 
      on t.SalesTerritoryKey = g.SalesTerritoryKey
    where t.SalesTerritoryCountry = 'United States' 

    order by g.StateProvinceName, g.City`), diproses melalui transformasi Third-Party: Derived Column, dan memuat hasilnya ke `Excel Destination`.
